<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | JobFinder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <a href="index.html" class="logo">JobFinder<span>.</span></a>
    <nav class="navigation">
        <a href="index.html">Home</a>
        <a href="register.html" class="nav-button">Register</a>
    </nav>
</header>

<main class="auth-section">
    <form class="auth-card" id="loginForm">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Login to JobFinder</h1>
        <p class="auth-description">Enter your details to continue.</p>

        <label for="email">Email address</label>
        <input type="email" id="email" required
               placeholder="you@example.com">

        <label for="password">Password</label>
        <input type="password" id="password" required
               placeholder="Enter your password">

        <button type="submit" class="auth-submit">Login</button>

        <p id="loginMessage" class="form-message" aria-live="polite"></p>

        <p class="auth-switch">
            Don't have an account?
            <a href="register.html">Register</a>
        </p>
    </form>
</main>

<footer class="footer">
    <a href="index.html" class="logo">JobFinder<span>.</span></a>
    <p>© 2026 JobFinder</p>
</footer>

<script src="script.js"></script>
</body>
</html>
